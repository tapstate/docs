[build]
  command = "pnpm build"
  publish = "out"

# Production uses the public custom domain as the canonical origin. Preview
# deployments retain their own immutable deploy URL, so their links do not
# point at production.
[context.production]
  command = "TAPSTATE_SITE_URL=https://tapstate.dev pnpm build"

[context.production.environment]
  TAPSTATE_SITE_INDEXABLE = "true"
  NEXT_PUBLIC_GA_ID = "G-242QS3Z8KP"

[context.deploy-preview]
  command = "TAPSTATE_SITE_URL=\"$DEPLOY_URL\" pnpm build"

[context.deploy-preview.environment]
  TAPSTATE_SITE_INDEXABLE = "false"

[context.branch-deploy]
  command = "TAPSTATE_SITE_URL=\"$DEPLOY_URL\" pnpm build"

[context.branch-deploy.environment]
  TAPSTATE_SITE_INDEXABLE = "false"
